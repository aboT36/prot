<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>حاسبة الأعلاف TMR</title>
  <style>
    body { font-family: Arial; direction: rtl; margin: 40px; max-width: 600px; }
    label, select, input, button { margin: 10px 0; display: block; width: 100%; }
    button { padding: 10px; }
    #tmrSection { display: none; }
    #milkSection { display: none; }
    #result { margin-top: 30px; font-weight: bold; white-space: pre-line; }
  </style>
</head>
<body>

  <h2>حاسبة احتياجات البروتين والطاقة والعليقة (TMR)</h2>

  <label>نوع الحيوان:</label>
  <select id="animal" onchange="updateUI()">
    <option value="cow">بقرة</option>
    <option value="buffalo">جاموس</option>
    <option value="sheep">غنم</option>
  </select>

  <label>الجنس:</label>
  <select id="gender" onchange="updateUI()">
    <option value="male">ذكر</option>
    <option value="female">أنثى</option>
  </select>

  <div id="milkStatus">
    <label>هل تنتج الحليب؟</label>
    <select id="producingMilk" onchange="toggleMilkInput()">
      <option value="no">لا</option>
      <option value="yes">نعم</option>
    </select>
  </div>

  <div id="milkSection">
    <label>كمية الحليب المنتجة (لتر/يوم):</label>
    <input type="number" id="milk">
  </div>

  <label>وزن الحيوان (كجم):</label>
  <input type="number" id="weight">

  <label>هل تود تكوين عليقة بنظام TMR؟</label>
  <select id="tmr" onchange="toggleTMR()">
    <option value="no">لا</option>
    <option value="yes">نعم</option>
  </select>

  <div id="tmrSection">
    <p>🔽 حساب العليقة سيتم بعد الحساب الأساسي.</p>
  </div>

  <button onclick="calculate()">احسب</button>

  <div id="result"></div>

  <script>
    function updateUI() {
      const gender = document.getElementById("gender").value;
      document.getElementById("milkStatus").style.display = gender === "female" ? "block" : "none";
      if (gender !== "female") {
        document.getElementById("milkSection").style.display = "none";
        document.getElementById("producingMilk").value = "no";
      }
    }

    function toggleMilkInput() {
      const producingMilk = document.getElementById("producingMilk").value;
      document.getElementById("milkSection").style.display = producingMilk === "yes" ? "block" : "none";
    }

    function toggleTMR() {
      const tmr = document.getElementById("tmr").value;
      document.getElementById("tmrSection").style.display = tmr === "yes" ? "block" : "none";
    }

    function calculate() {
      const weight = parseFloat(document.getElementById("weight").value);
      const milk = parseFloat(document.getElementById("milk").value) || 0;
      const gender = document.getElementById("gender").value;
      const producingMilk = document.getElementById("producingMilk").value === "yes";
      const tmr = document.getElementById("tmr").value === "yes";
      const animal = document.getElementById("animal").value;

      let meReq = 0;
      let mpReq = 0;

      if (animal === "cow") {
        meReq = 0.08 * Math.pow(weight, 0.75);
        mpReq = 3.8 * Math.pow(weight, 0.75);
        if (gender === "female" && producingMilk && milk > 0) {
          meReq += milk * 0.7; // Mcal/liter of milk
          mpReq += (milk * 35) / 0.67; // 35g protein/kg milk, 67% efficiency
        }
      } else if (animal === "buffalo") {
        meReq = 0.08 * Math.pow(weight, 0.75);
        mpReq = 3.8 * Math.pow(weight, 0.75);
        if (gender === "female" && producingMilk && milk > 0) {
          meReq += milk * 0.85; // higher energy per kg milk for buffalo
          mpReq += (milk * 35) / 0.50; // lower efficiency
        }
      } else if (animal === "sheep") {
        meReq = 0.06 * Math.pow(weight, 0.75);
        mpReq = 3.0 * Math.pow(weight, 0.75);
        if (gender === "female" && producingMilk && milk > 0) {
          meReq += milk * 0.7;
          mpReq += (milk * 55) / 0.67; // sheep milk ~5.5% protein
        }
      }

      let meGrams = (meReq * 1000).toFixed(0);
      let mpKg = (mpReq / 1000).toFixed(2);

      let output = `💡 الاحتياج اليومي:\n` +
                   `• الطاقة: ${meReq.toFixed(2)} Mcal\n` +
                   `• الطاقة: ${meGrams} جرام\n` +
                   `• البروتين المهضوم (MP): ${mpKg} كجم\n`;

      if (tmr) {
        const tmrMix = {
          "سيلاج": 0.4,
          "دريس": 0.2,
          "بلح": 0.1,
          "علف مركز": 0.3
        };

        const totalFeed = (meReq / 2.6).toFixed(2);
        output += `\n🍽️ اقتراح عليقة TMR (${totalFeed} كجم/يوم):\n`;
        for (const item in tmrMix) {
          output += `- ${item}: ${(tmrMix[item] * totalFeed).toFixed(2)} كجم\n`;
        }
      }

      document.getElementById("result").innerText = output;
    }

    updateUI();
  </script>

</body>
</html>
